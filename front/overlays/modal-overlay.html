<div class="modal-overlay" id="modal-delete" role="dialog" aria-modal="true" aria-labelledby="modal-delete-title" hidden>

      <!-- 경고 아이콘 -->
      <div class="modal__icon-wrap" aria-hidden="true">⚠️</div>
 
      <!-- 타이틀 -->
