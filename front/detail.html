<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상욕순화기 · 기록 상세/편집</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sok screen sok-surface sok-grid">
  <div class="sok-pad sok-z">

    <div class="sok-appbar">
      <div class="sok-logo">상<span class="acc">욕</span>순화기</div>
      <button class="sok-iconbtn" id="btnBack" title="뒤로">
        <svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:18px">
      <span class="sok-badge sev" id="sevBadge">심각도 <span class="n">-</span>/10</span>
      <span class="sok-badge edited" id="editedBadge" style="display:none">수정됨</span>
    </div>

    <div class="sok-block-label">원문 수정</div>
    <textarea class="sok-field" id="inputText" rows="3" style="margin-bottom:18px"
      placeholder="원문을 입력하세요"></textarea>

    <div class="sok-block-label" id="resultLabel">현재 순화 결과 · -</div>
    <div id="resultBox" style="border:1px solid var(--line-2);border-radius:11px;padding:14px 15px;
      font-size:15px;font-weight:600;letter-spacing:-0.02em;color:var(--text-2);
      line-height:1.45;margin-bottom:20px;min-height:52px"></div>

    <div class="sok-block-label">말투 모드 변경</div>
    <div class="sok-chips" id="chipGroup">
      <button class="sok-chip" data-mode="scholar">선비</button>
      <button class="sok-chip" data-mode="trend">어쩔티비</button>
      <button class="sok-chip" data-mode="rant">주접</button>
      <button class="sok-chip" data-mode="cute">뿌잉뿌잉</button>
      <button class="sok-chip" data-mode="interview">면접</button>
    </div>

    <div style="height:16px"></div>

    <button class="sok-cta" id="btnRetry">
      <svg class="ic" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-3-6.7"/>
        <path d="M21 3v5h-5"/>
      </svg>재순화
    </button>
    <p class="sok-body" style="font-size:12px;margin-top:10px;text-align:center">
      재순화하면 이전 결과는 새 결과로 교체돼요.
    </p>

  </div>
</div>

<script>
/* =========================================================
   detail_standalone.html
   USE_DUMMY = true  → 더미 데이터로 UI 확인
   USE_DUMMY = false → 실제 Django API (localhost:8000) 연결
   ========================================================= */

const USE_DUMMY = false;

/* ── API Base URL ──────────────────────────────────────────
   상대경로('')를 지정하여 호스트(127.0.0.1 vs localhost) 간 CORS 충돌 방지 */
const BASE_URL = '';

/* ── CSRF 토큰 파싱 ── */
function getCsrf() {
  return document.cookie.split('; ')
    .find(r => r.startsWith('csrftoken='))?.split('=')[1] ?? '';
}

/* ── 공통 fetch 래퍼 ──────────────────────────────────────
   - credentials: 'include' → Django 세션 쿠키 자동 포함 (필수)
   - CORS/네트워크 에러 별도 포착                             */
async function apiFetch(path, options = {}) {
  const method  = (options.method || 'GET').toUpperCase();
  const headers = { 'Content-Type': 'application/json', ...options.headers };
  if (['POST','PUT','PATCH','DELETE'].includes(method)) {
    const csrf = getCsrf();
    if (csrf) headers['X-CSRFToken'] = csrf;
  }

  const res = await fetch(`${BASE_URL}${path}`, {
    ...options, method, headers,
    credentials: 'include',
  }).catch(() => {
    throw new Error('서버에 연결할 수 없어요. Django 서버(8000)가 실행 중인지 확인해 주세요.');
  });

  if (res.status === 204) return null;

  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
  return data;
}

/* ── 유틸 ── */
const MODE_LABELS = { scholar:'선비', trend:'어쩔티비', cute:'뿌잉뿌잉', rant:'주접', interview:'면접' };
const modeLabel = m => MODE_LABELS[m] ?? m;

function showToast(msg, type = 'ok') {
  document.querySelectorAll('.tok-wrap, .sok-toast-wrapper').forEach(e => e.remove());
  const icon = type === 'ok'
    ? `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m20 6-11 11-5-5"/></svg>`
    : `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>`;
  const w = Object.assign(document.createElement('div'), { className: 'tok-wrap' });
  w.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:999;';
  w.innerHTML = `<div class="sok-toast ${type}">${icon} ${msg}</div>`;
  document.body.appendChild(w);
  setTimeout(() => { w.style.transition='opacity .3s'; w.style.opacity='0'; setTimeout(()=>w.remove(),300); }, 2200);
}

const Store = {
  set(k, v) { try { sessionStorage.setItem('sok_'+k, JSON.stringify(v)); } catch(_){} },
  get(k)    { try { return JSON.parse(sessionStorage.getItem('sok_'+k)); } catch(_){ return null; } },
  remove(k) { try { sessionStorage.removeItem('sok_'+k); } catch(_){} },
};

/* ── 요소 ── */
const sevBadge    = document.getElementById('sevBadge');
const editedBadge = document.getElementById('editedBadge');
const inputText   = document.getElementById('inputText');
const resultBox   = document.getElementById('resultBox');
const resultLabel = document.getElementById('resultLabel');
const chipGroup   = document.getElementById('chipGroup');
const btnRetry    = document.getElementById('btnRetry');

const RETRY_ICON = `<svg class="ic" viewBox="0 0 24 24">
  <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>`;

/* ── Store에서 레코드 로드 ── */
const record = Store.get('editRecord');
if (!record) {
  // 데이터 없이 직접 접근한 경우 이력으로 복귀
  window.location.href = 'history.html';
}

/* ── 초기 렌더링: history에서 전달된 record로 화면 채우기 ── */
function renderDetail(rec) {
  // 심각도 배지
  const sev = rec.severity_score ?? 0;
  sevBadge.innerHTML = `심각도 <span class="n">${sev}</span>/10`;
  sevBadge.classList.remove('mid','low');
  if      (sev <= 3) sevBadge.classList.add('low');
  else if (sev <= 6) sevBadge.classList.add('mid');

  // 수정됨 배지 (updated_at이 응답에 있을 때만)
  const isEdited = rec.updated_at && rec.created_at !== rec.updated_at;
  if (isEdited) {
    const d  = new Date(rec.updated_at);
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    editedBadge.textContent = `수정됨 · ${hh}:${mm}`;
    editedBadge.style.display = '';
  } else {
    editedBadge.style.display = 'none';
  }

  // 원문 textarea에 채우기 — 사용자가 직접 수정 가능
  inputText.value = rec.original_text;

  // 순화 결과 표시
  resultBox.textContent = rec.purified_text;

  // 결과 레이블 모드명
  resultLabel.textContent = `현재 순화 결과 · ${modeLabel(rec.mode)}`;

  // 현재 모드 칩 활성화
  setActiveChip(rec.mode);
}

renderDetail(record);

/* ── 칩 ── */
function setActiveChip(mode) {
  chipGroup.querySelectorAll('.sok-chip').forEach(c => {
    c.classList.toggle('is-active', c.dataset.mode === mode);
  });
}
function getActiveMode() {
  return chipGroup.querySelector('.sok-chip.is-active')?.dataset.mode ?? 'scholar';
}

chipGroup.querySelectorAll('.sok-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    setActiveChip(chip.dataset.mode);
    // 칩 변경 시 결과 레이블 즉시 업데이트
    resultLabel.textContent = `현재 순화 결과 · ${modeLabel(chip.dataset.mode)}`;
  });
});

/* ── 뒤로 버튼 ── */
document.getElementById('btnBack').addEventListener('click', () => {
  Store.remove('editRecord');
  window.location.href = 'history.html';
});

/* ── 재순화 버튼 ── */
btnRetry.addEventListener('click', async () => {
  const newText = inputText.value.trim();
  const newMode = getActiveMode();

  if (!newText) { showToast('원문을 입력해 주세요.', 'err'); return; }

  const textChanged = newText !== record.original_text;
  const modeChanged = newMode !== record.mode;

  if (!textChanged && !modeChanged) {
    showToast('변경된 내용이 없어요.', 'err');
    return;
  }

  // 로딩 상태
  btnRetry.disabled = true;
  btnRetry.innerHTML = `<span class="sok-spinner"></span> 처리 중…`;

  if (USE_DUMMY) {
    // 더미 시뮬레이션 — 실제 Groq 호출 없이 화면 동작만 확인
    await new Promise(r => setTimeout(r, 700));
    Store.remove('editRecord');
    showToast('저장했어요. (더미)', 'ok');
    setTimeout(() => { window.location.href = 'history.html'; }, 1000);

  } else {
    /*
     * 실제 API 호출
     *
     * textChanged (원문 변경 포함) → PUT /api/records/{id}/
     *   서버가 Groq 재호출 → purified_text 새로 생성
     *
     * modeChanged only (모드만 변경) → PATCH /api/records/{id}/
     *   서버가 Groq 재호출 → 같은 원문을 새 모드로 순화
     *
     * 두 경우 모두 응답: { id, original_text, purified_text,
     *                      mode, severity_score, created_at }
     */
    try {
      const method = textChanged ? 'PUT' : 'PATCH';
      await apiFetch(`/api/records/${record.id}/`, {
        method,
        body: JSON.stringify({ original_text: newText, mode: newMode }),
      });

      Store.remove('editRecord');
      showToast('재순화 완료!', 'ok');
      setTimeout(() => { window.location.href = 'history.html'; }, 1000);

    } catch (err) {
      console.error('[detail] error:', err);
      btnRetry.disabled = false;
      btnRetry.innerHTML = RETRY_ICON + '재순화';
      showToast(err.message || '요청에 실패했어요. 다시 시도해 주세요.', 'err');
    }
  }
});
</script>
</body>
</html>
