<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상욕순화기 · 결과</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sok screen sok-surface sok-grid">
  <div class="sok-pad sok-z">
    <div class="sok-appbar">
      <div class="sok-logo">상<span class="acc">욕</span>순화기</div>
      <button class="sok-iconbtn" title="뒤로"><svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:16px">
      <span class="sok-badge sev">심각도 <span class="n">8</span>/10</span>
      <span class="sok-badge mode">선비</span>
    </div>
    <div class="sok-orig" style="margin-bottom:18px"><span class="lab">원문</span>아 ㅈㄴ 어이없네 진짜</div>
    <div class="sok-block-label">순화 결과</div>
    <div class="sok-result" style="margin-bottom:18px">허, 이는 참으로 어처구니없는 일이로다.</div>
    <div style="display:flex;gap:9px;margin-bottom:9px">
      <button class="sok-btn" id="copyBtn"><svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>복사</button>
      <button class="sok-btn" id="memeBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M5 21h14"/></svg>짤 저장</button>
      <button class="sok-btn" id="retryBtn"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/></svg>다시 변환</button>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script src="result.js"></script>
</body>
</html>
